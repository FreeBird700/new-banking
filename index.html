<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Adinkra Trust Bank - Ghana's premier gold banking institution offering PMMC-accredited gold trading, storage, financing, and escrow services for traders and investors." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://www.adinkraybank.org" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adinkra Trust Bank - Ghana's Gold Banking Specialists" />
    <meta property="og:description" content="Secure PMMC-accredited gold banking services including trading, storage, financing, and escrow solutions for traders and investors in Ghana." />

    <meta property="og:url" content="https://www.adinkraybank.org" />

    <!-- Twitter Card data -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adinkra Trust Bank - Ghana's Gold Banking Specialists" />
    <meta name="twitter:description" content="Secure PMMC-accredited gold banking services including trading, storage, financing, and escrow solutions for traders and investors in Ghana." />
    <meta name="twitter:image" content="https://www.adinkraybank.org/og-image.jpg" />
    
    <title>Adinkra Trust Bank | Ghana's Premier Gold Banking Institution</title>
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" as="style">
    
    <!-- Load fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- App manifest for PWA support -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/src/main.tsx" as="script" type="module" />
    
    <!-- Inline critical CSS -->
    <style>
      /* Critical CSS for initial render */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f9fafb;
        color: #111827;
      }
      
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      
      /* Loading spinner for initial load */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f9fafb;
        z-index: 9999;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(37, 99, 235, 0.2);
        border-radius: 50%;
        border-top-color: #2563eb;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state -->
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    
    <!-- Structured data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FinancialService",
        "name": "Adinkra Trust Bank",
        "description": "Ghana's premier gold banking institution offering PMMC-accredited gold trading, storage, financing, and escrow services for traders and investors.",
        "url": "https://www.adinkraybank.org",
        "logo": "https://www.adinkraybank.org/logo.jpg",
        "image": "https://www.adinkraybank.org/bank-image.jpg",
        "priceRange": "$$",
        "sameAs": [
          "https://www.facebook.com/adinkratrustbank",
          "https://www.twitter.com/adinkrabank",
          "https://www.linkedin.com/company/adinkra-trust-bank",
          "https://www.instagram.com/adinkratrustbank"
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Financial Avenue",
          "addressLocality": "Accra",
          "addressRegion": "Greater Accra",
          "postalCode": "00233",
          "addressCountry": "GH"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "5.6037",
          "longitude": "-0.1870"
        },
        "telephone": "+233-302-123456",
        "openingHours": "Mo,Tu,We,Th,Fr 09:00-17:00",
        "areaServed": {
          "@type": "Country",
          "name": "Ghana"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Gold Banking Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Gold Escrow Accounts"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Gold Storage"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Gold-Backed Loans"
              }
            }
          ]
        }
      }
    </script>
    
    <!-- BreadcrumbList structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://www.adinkraybank.org"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Services",
            "item": "https://www.adinkraybank.org/services"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "Contact",
            "item": "https://www.adinkraybank.org/contact"
          }
        ]
      }
    </script>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Remove initial loader once app is loaded -->
    <script>
      window.addEventListener('load', function() {
        const loader = document.querySelector('.initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.5s ease';
          setTimeout(() => {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 500);
        }
      });
    </script>
    
    <!-- Deferred analytics script -->
    <script async defer src="/analytics.js"></script>
    
    <!-- Sitemap reference (create this file in your public directory) -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </body>
</html>
